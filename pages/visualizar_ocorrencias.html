<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ver Ocorrências - Ocorrencia.Web</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #111111;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #222;
      padding: 20px 0;
      color: white;
      box-shadow: 0 2px 5px rgb(0 0 0 / 0.5);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
    }

    .header-container h1 {
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: 1.2px;
    }

    .header-container h1 a {
      color: white;
      text-decoration: none;
    }

    .header-container h1 a:hover {
      text-decoration: underline;
    }

    nav button {
      background: transparent;
      border: 2px solid white;
      padding: 8px 16px;
      border-radius: 25px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    nav button:hover {
      background-color: white;
      color: #222;
    }

    main {
      flex: 1;
      padding: 40px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 {
      font-size: 2.4rem; /* maior */
      font-weight: 700;
      margin-bottom: 30px;
      color: #4da6ff;
      text-align: center;
      width: 100%;
    }

    .lista-ocorrencias {
      background: #333;
      border-radius: 12px;
      padding: 30px 40px;
      box-shadow: 0 6px 25px rgb(0 0 0 / 0.8);
      color: white;
      width: 40vw;  /* ocupa até 40% da largura da tela */
      min-width: 320px; /* para não ficar muito pequeno em telas menores */
      min-height: 300px;
      overflow-y: auto;
    }

    .ocorrencia-item {
      border-bottom: 1px solid #555;
      padding: 20px 0;
    }

    .ocorrencia-item:last-child {
      border-bottom: none;
    }

    .ocorrencia-titulo {
      font-weight: 700;
      font-size: 1.6rem; /* um pouco maior */
      color: #4da6ff;
      margin-bottom: 10px;
    }

    .ocorrencia-descricao {
      margin-bottom: 15px;
      line-height: 1.6;
      color: #ddd;
      font-size: 1.2rem; /* maior */
    }

    .ocorrencia-info {
      font-size: 1.1rem; /* maior */
      color: #bbb;
      margin-bottom: 10px;
    }

    .ocorrencia-imagem {
      max-width: 100%;
      max-height: 300px;
      display: block;
      margin-top: 10px;
      border-radius: 12px;
      object-fit: contain;
      box-shadow: 0 4px 12px rgba(77, 166, 255, 0.7);
    }

    .sem-ocorrencias {
      text-align: center;
      padding: 100px 20px;
      font-size: 1.5rem; /* maior */
      color: #bbb;
      font-style: italic;
    }

    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 15px 10px;
      font-size: 0.9rem;
      margin-top: auto;
      box-shadow: 0 -2px 5px rgb(0 0 0 / 0.5);
    }

    /* Responsivo */
    @media (max-width: 900px) {
      .lista-ocorrencias {
        width: 80vw; /* em telas menores, ocupa mais da largura */
        min-width: unset;
      }
    }

    @media (max-width: 480px) {
      h2 {
        font-size: 2rem;
      }
      .ocorrencia-titulo {
        font-size: 1.3rem;
      }
      .ocorrencia-descricao {
        font-size: 1rem;
      }
      .ocorrencia-info {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="header-container">
    <h1><a >Ocorrencia.Web</a></h1>
    <nav>
      <button class="btn" onclick="window.location.href='dashboard.html'">Voltar</button>
      <button onclick="location.href='login.html'">Login</button>
    </nav>
  </div>
</header>

<main>
  <h2>Ocorrências Registradas</h2>

  <div class="lista-ocorrencias" id="listaOcorrencias">
    <!-- Ocorrências carregadas aqui -->
  </div>
</main>

<footer>
  <p>© 2025 Ocorrencia.Web - Todos os direitos reservados</p>
</footer>

<script>
  function formatarData(dataStr) {
    const opcoes = { year: 'numeric', month: '2-digit', day: '2-digit' };
    const data = new Date(dataStr);
    if (isNaN(data)) return dataStr;
    return data.toLocaleDateString('pt-BR', opcoes);
  }

  function carregarOcorrencias() {
    const listaDiv = document.getElementById('listaOcorrencias');
    const ocorrencias = JSON.parse(localStorage.getItem('ocorrencias')) || [];

    if (ocorrencias.length === 0) {
      listaDiv.innerHTML = '<p class="sem-ocorrencias">Nenhuma ocorrência registrada ainda.</p>';
      return;
    }

    listaDiv.innerHTML = ocorrencias.map(oc => `
      <div class="ocorrencia-item">
        <div class="ocorrencia-titulo">${oc.titulo}</div>
        <div class="ocorrencia-descricao">${oc.descricao}</div>
        ${oc.imagem ? `<img src="${oc.imagem}" alt="Imagem da ocorrência" class="ocorrencia-imagem" />` : ''}
        <div class="ocorrencia-info">
          <strong>Localização:</strong> ${oc.localizacao} <br />
          <strong>Data:</strong> ${formatarData(oc.data_ocorrencia)}
        </div>
      </div>
    `).join('');
  }

  window.onload = carregarOcorrencias;
</script>
<script>
  function formatarData(dataStr) {
    const opcoes = { year: 'numeric', month: '2-digit', day: '2-digit' };
    const data = new Date(dataStr);
    if (isNaN(data)) return dataStr;
    return data.toLocaleDateString('pt-BR', opcoes);
  }

  function atualizarStatusOcorrencia(index, novoStatus) {
    const ocorrencias = JSON.parse(localStorage.getItem('ocorrencias')) || [];
    if (!ocorrencias[index]) return;
    ocorrencias[index].status = novoStatus;
    localStorage.setItem('ocorrencias', JSON.stringify(ocorrencias));
    carregarOcorrencias();  // Recarrega a lista para atualizar a interface
  }

  function carregarOcorrencias() {
    const listaDiv = document.getElementById('listaOcorrencias');
    const ocorrencias = JSON.parse(localStorage.getItem('ocorrencias')) || [];

    if (ocorrencias.length === 0) {
      listaDiv.innerHTML = '<p class="sem-ocorrencias">Nenhuma ocorrência registrada ainda.</p>';
      return;
    }

    listaDiv.innerHTML = ocorrencias.map((oc, index) => `
      <div class="ocorrencia-item">
        <div class="ocorrencia-titulo">${oc.titulo}</div>
        <div class="ocorrencia-descricao">${oc.descricao}</div>
        ${oc.imagem ? `<img src="${oc.imagem}" alt="Imagem da ocorrência" class="ocorrencia-imagem" />` : ''}
        <div class="ocorrencia-info">
          <strong>Localização:</strong> ${oc.localizacao} <br />
          <strong>Data:</strong> ${formatarData(oc.data_ocorrencia)} <br />
          <strong>Status:</strong> <span style="text-transform: capitalize;">${oc.status || 'pendente'}</span>
        </div>

        <!-- Caixa para o administrador aceitar ou recusar -->
        <div style="margin-top: 15px;">
          ${oc.status === 'aceita' ? 
            '<strong style="color: #4CAF50;">Aceita</strong>' : 
            oc.status === 'recusada' ? 
            '<strong style="color: #f44336;">Recusada</strong>' : 
            `
              <button onclick="atualizarStatusOcorrencia(${index}, 'aceita')" style="margin-right: 10px; padding: 8px 16px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">
                Aceitar
              </button>
              <button onclick="atualizarStatusOcorrencia(${index}, 'recusada')" style="padding: 8px 16px; background-color: #f44336; color: white; border: none; border-radius: 5px; cursor: pointer;">
                Recusar
              </button>
            `
          }
        </div>
      </div>
    `).join('');
  }

  window.onload = carregarOcorrencias;
</script>

</body>
</html>
