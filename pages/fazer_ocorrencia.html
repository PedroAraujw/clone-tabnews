<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registrar Ocorrência - Ocorrencia.Web</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #111111;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #222;
      padding: 20px 0;
      color: white;
      box-shadow: 0 2px 5px rgb(0 0 0 / 0.5);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
    }

    .header-container h1 {
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: 1.2px;
    }

    .header-container h1 a {
      color: white;
      text-decoration: none;
    }

    .header-container h1 a:hover {
      text-decoration: underline;
    }

    nav a, nav button {
      background: transparent;
      border: 2px solid white;
      padding: 8px 16px;
      border-radius: 25px;
      color: white;
      font-weight: 600;
      text-decoration: none;
      margin-left: 15px;
      transition: background-color 0.3s ease, color 0.3s ease;
      cursor: pointer;
    }

    nav a:hover, nav button:hover {
      background-color: white;
      color: #222;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 15px;
    }

    .form-container {
      background: #333;
      max-width: 600px;
      width: 100%;
      padding: 40px 50px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgb(0 0 0 / 0.7);
      color: white;
    }

    .form-container h2 {
      margin-bottom: 25px;
      font-size: 1.8rem;
      font-weight: 700;
      color: #4da6ff;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #ddd;
      margin-top: 20px;
    }

    input[type="text"],
    input[type="date"],
    input[type="file"],
    textarea {
      width: 100%;
      padding: 14px 18px;
      border-radius: 8px;
      border: 1.8px solid #444;
      font-size: 1rem;
      resize: vertical;
      transition: border-color 0.3s ease;
      font-family: inherit;
      background: #2b2b2b;
      color: white;
    }

    input[type="text"]:focus,
    input[type="date"]:focus,
    input[type="file"]:focus,
    textarea:focus {
      outline: none;
      border-color: #4da6ff;
      box-shadow: 0 0 8px #4da6ff;
    }

    textarea {
      min-height: 120px;
    }

    button[type="submit"] {
      width: 100%;
      padding: 15px;
      margin-top: 30px;
      background-color: #4da6ff;
      border: none;
      border-radius: 25px;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
      box-shadow: 0 4px 10px rgb(77 166 255 / 0.6);
    }

    button[type="submit"]:hover {
      background-color: #3399ff;
      box-shadow: 0 6px 15px rgb(51 153 255 / 0.8);
    }

    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 15px 10px;
      font-size: 0.9rem;
      margin-top: auto;
      box-shadow: 0 -2px 5px rgb(0 0 0 / 0.5);
    }

    @media (max-width: 520px) {
      .form-container {
        padding: 30px 25px;
      }

      nav a, nav button {
        padding: 7px 12px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="header-container">
    <h1><a href="index.html">Ocorrencia.Web</a></h1>
    <nav>
      <button class="btn" onclick="window.location.href='dashboard.html'">Voltar</button>
      <button onclick="location.href='login.html'">Login</button>
    </nav>
  </div>
</header>

<main>
  <div class="form-container">
    <h2>Registrar Nova Ocorrência</h2>
    <form id="formOcorrencia">
      <label for="titulo">Título da Ocorrência</label>
      <input type="text" id="titulo" name="titulo" placeholder="Informe o título" required />

      <label for="descricao">Descrição</label>
      <textarea id="descricao" name="descricao" placeholder="Descreva a ocorrência com detalhes" required></textarea>

      <label for="localizacao">Localização</label>
      <input type="text" id="localizacao" name="localizacao" placeholder="Informe o local da ocorrência" required />

      <label for="data_ocorrencia">Data da Ocorrência</label>
      <input type="date" id="data_ocorrencia" name="data_ocorrencia" required />

      <label for="imagem_ocorrencia">Imagem da Ocorrência (opcional)</label>
      <input type="file" id="imagem_ocorrencia" name="imagem_ocorrencia" accept="image/*" />

      <button type="submit">Registrar Ocorrência</button>
    </form>
  </div>
</main>

<footer>
  <p>© 2025 Ocorrencia.Web - Todos os direitos reservados</p>
</footer>

<script>
  document.getElementById('formOcorrencia').addEventListener('submit', function(event) {
    event.preventDefault();

    const titulo = document.getElementById('titulo').value.trim();
    const descricao = document.getElementById('descricao').value.trim();
    const localizacao = document.getElementById('localizacao').value.trim();
    const data_ocorrencia = document.getElementById('data_ocorrencia').value;
    const imagemInput = document.getElementById('imagem_ocorrencia');
    const imagemFile = imagemInput.files[0];

    if (imagemFile) {
      const reader = new FileReader();
      reader.onload = function(e) {
        salvarOcorrencia(titulo, descricao, localizacao, data_ocorrencia, e.target.result);
      };
      reader.readAsDataURL(imagemFile); // Converte imagem para base64
    } else {
      salvarOcorrencia(titulo, descricao, localizacao, data_ocorrencia, null);
    }
  });

  function salvarOcorrencia(titulo, descricao, localizacao, data_ocorrencia, imagemBase64) {
    const novaOcorrencia = { titulo, descricao, localizacao, data_ocorrencia, imagem: imagemBase64 };
    const ocorrencias = JSON.parse(localStorage.getItem('ocorrencias')) || [];
    ocorrencias.push(novaOcorrencia);
    localStorage.setItem('ocorrencias', JSON.stringify(ocorrencias));
    window.location.href = 'visualizar_ocorrencias.html';
  }
</script>

</body>
</html>
