<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro - Ocorrencia.Web</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Estilo para a checkbox customizada */
    .checkbox-container {
      display: flex;
      align-items: center;
      margin-top: 15px;
      cursor: pointer;
      user-select: none;
      font-weight: 600;
      color: #4da6ff;
      position: relative;
      padding-left: 35px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: color 0.3s ease;
    }
    .checkbox-container:hover {
      color: #3399ff;
    }
    .checkbox-container input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      cursor: pointer;
      height: 0;
      width: 0;
    }
    /* Caixa customizada */
    .checkmark {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 22px;
      width: 22px;
      background-color: #2b2b2b;
      border: 2px solid #4da6ff;
      border-radius: 6px;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }
    /* Quando marcada */
    .checkbox-container input:checked ~ .checkmark {
      background-color: #4da6ff;
      border-color: #3399ff;
      box-shadow: 0 0 8px #3399ff;
    }
    /* Marca de check */
    .checkmark:after {
      content: "";
      position: absolute;
      display: none;
    }
    /* Mostrar marca quando checado */
    .checkbox-container input:checked ~ .checkmark:after {
      display: block;
    }
    /* Estilo da marca de check */
    .checkbox-container .checkmark:after {
      left: 7px;
      top: 3px;
      width: 6px;
      height: 12px;
      border: solid white;
      border-width: 0 3px 3px 0;
      transform: rotate(45deg);
    }
  </style>
</head>
<body>

<header>
  <div class="container header-container">
    <h1>Ocorrencia.Web</h1>
    <nav>
      <a href="index.html" class="btn">Voltar</a>
    </nav>
  </div>
</header>

<main class="hero">
  <div class="container">
    <h2>Crie sua conta</h2>
    <form id="formCadastro" class="formulario cadastro-form" action="cadastro.php" method="POST">
      <input type="text" name="cadastroNome" id="cadastroNome" placeholder="Nome completo" required />
      <input type="email" name="cadastroEmail" id="cadastroEmail" placeholder="E-mail" required />
      <input type="text" name="cadastroTelefone" id="cadastroTelefone" placeholder="Telefone" required />
      <input type="text" name="cadastroCPF" id="cadastroCPF" placeholder="CPF" required />
      <input type="text" name="cadastroEndereco" id="cadastroEndereco" placeholder="Endereço" required />
      <input type="text" name="cadastroCidade" id="cadastroCidade" placeholder="Cidade" required />
      <input type="text" name="cadastroEstado" id="cadastroEstado" placeholder="Estado (ex: PR)" required />
      <input type="password" name="cadastroSenha" id="cadastroSenha" placeholder="Senha" required />
      <input type="password" name="cadastroConfirmaSenha" id="cadastroConfirmaSenha" placeholder="Confirme a senha" required />

      <!-- Caixa de admin estilizada -->
      <label class="checkbox-container">
        Desejo me cadastrar como administrador
        <input type="checkbox" name="cadastroAdmin" id="cadastroAdmin" />
        <span class="checkmark"></span>
      </label>

      <button type="submit" class="btn-primary">Cadastrar</button>
      <p class="link-cadastro">Já tem conta? <a href="login.html">Entrar</a></p>
    </form>
  </div>
</main>

<footer>
  <div class="container">
    <p>© 2025 Ocorrencia.Web - Todos os direitos reservados</p>
  </div>
</footer>

</body>
</html>
